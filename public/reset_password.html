<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your Agromate password</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203027; background: #f3f7f2; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); box-sizing: border-box; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 8px 32px #18392218; }
    h1 { margin-top: 0; color: #267343; }
    label { display: block; margin: 18px 0 6px; font-weight: 600; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #bdcabe; border-radius: 8px; font: inherit; }
    button { margin-top: 24px; border: 0; color: white; background: #267343; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
<main>
  <h1>Reset password</h1>
  <p>Choose a new password for your Agromate account.</p>
  <form id="reset-form">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" name="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
    <button id="submit-button" type="submit">Update password</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  const form = document.getElementById('reset-form');
  const status = document.getElementById('status');
  const button = document.getElementById('submit-button');
  const searchParams = new URLSearchParams(window.location.search);
  const token = searchParams.get('token');
  const email = searchParams.get('email');

  if (!token || !email) {
    status.textContent = 'This reset link is missing its token or email. Request a new password reset email.';
    form.hidden = true;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirmation = document.getElementById('confirm-password').value;
    if (password !== confirmation) {
      status.textContent = 'The passwords do not match.';
      return;
    }

    button.disabled = true;
    status.textContent = 'Updating password…';
    try {
      const response = await fetch(`/reset_password?email=${encodeURIComponent(email)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const result = await response.json();
      status.textContent = result.message || (response.ok ? 'Password updated.' : 'Unable to reset password.');
      if (response.ok) form.reset();
    } catch (_) {
      status.textContent = 'Unable to contact the server. Please try again.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
